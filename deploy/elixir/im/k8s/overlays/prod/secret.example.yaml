# 示例 Secret — 勿直接 kubectl apply 本文件
# 生产须用外部 Secret 管理（Sealed Secrets / External Secrets / 云厂商 Secret Manager）
#
# 创建方式（二选一）：
#
#   kubectl create secret generic im-runtime -n im-prod \
#     --from-literal=SECRET_KEY_BASE="$(openssl rand -base64 64 | tr -d '\n')" \
#     --from-literal=RELEASE_COOKIE="$(openssl rand -hex 16)" \
#     --from-literal=DATABASE_URL="ecto://USER:PASS@pg-host:5432/im_prod"
#
# 或从 env 文件（勿提交 git）：
#
#   kubectl create secret generic im-runtime -n im-prod --from-env-file=im-runtime.env
#
apiVersion: v1
kind: Secret
metadata:
  name: im-runtime
  labels:
    app: im
type: Opaque
stringData:
  SECRET_KEY_BASE: "REPLACE_WITH_64_PLUS_CHAR_RANDOM_STRING"
  RELEASE_COOKIE: "REPLACE_WITH_RANDOM_HEX"
  DATABASE_URL: "ecto://USER:PASSWORD@postgres.example.com:5432/im_prod"
