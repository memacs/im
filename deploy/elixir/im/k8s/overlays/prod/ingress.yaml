apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: im
  labels:
    app: im
  annotations:
    # 按集群 Ingress Controller 调整，例如 nginx：
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - im.example.com
      secretName: im-tls
  rules:
    - host: im.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: im
                port:
                  name: http
