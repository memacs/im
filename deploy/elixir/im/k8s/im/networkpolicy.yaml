# 限制 im Pod 仅接受集群内流量（P9+ 生产基线）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: im
  namespace: im-dev
spec:
  podSelector:
    matchLabels:
      app: im
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: im
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: im-dev
      ports:
        - protocol: TCP
          port: 4000
        - protocol: TCP
          port: 4369
