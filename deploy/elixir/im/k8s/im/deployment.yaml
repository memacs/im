apiVersion: apps/v1
kind: Deployment
metadata:
  name: im
  namespace: im-dev
  labels:
    app: im
spec:
  replicas: 1
  selector:
    matchLabels:
      app: im
  template:
    metadata:
      labels:
        app: im
    spec:
      containers:
        - name: im
          image: im:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: im
            - secretRef:
                name: im-runtime
          # 多副本时用于构造唯一 RELEASE_NODE（runtime.exs 或启动脚本读取）
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Phase 9 多副本：取消下行注释，覆盖 ConfigMap 中的 RELEASE_NODE
            # - name: RELEASE_NODE
            #   value: "im@$(POD_IP)"   # 需启动脚本展开；或 runtime.exs 读 POD_IP 拼接
          # 启动窗口：BEAM 冷启动期间不让 liveness 误杀
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # 就绪查主库；失败只摘流量，不重启
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 6
          # 存活不查库；数据库抖动不应重启整个集群
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
