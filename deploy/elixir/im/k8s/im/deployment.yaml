apiVersion: apps/v1
kind: Deployment
metadata:
  name: im
  namespace: im-dev
  labels:
    app: im
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # 长连接服务：先起新 Pod 再摘旧 Pod，容量不下降
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  selector:
    matchLabels:
      app: im
  template:
    metadata:
      labels:
        app: im
    spec:
      # WebSocket 需要时间把在途消息写完并让客户端重连到新 Pod
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # 与 Dockerfile 的 USER nobody:nogroup 一致
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: im
          image: im:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 4000
            - name: epmd
              containerPort: 4369
          envFrom:
            - configMapRef:
                name: im
            - secretRef:
                name: im-runtime
          env:
            # Release 启动脚本需要可写目录；根文件系统只读，指向 emptyDir
            - name: RELEASE_TMP
              value: /tmp
            # 多副本：rel/env.sh 在 RELEASE_NODE_MODE=pod_ip 时导出 RELEASE_NODE=im@$POD_IP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # 启动窗口：BEAM 冷启动期间不让 liveness 误杀
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # 就绪查主库；失败只摘流量，不重启
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 存活不查库；数据库抖动不应重启整个集群
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Endpoint 摘除是异步的，先等一会儿再让应用开始关闭
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
