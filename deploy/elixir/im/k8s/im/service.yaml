apiVersion: v1
kind: Service
metadata:
  name: im
  namespace: im-dev
  labels:
    app: im
spec:
  type: ClusterIP
  # WebSocket 重连尽量回到同一 Pod，减少 Tracker/Presence 抖动
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
    - name: http
      port: 4000
      targetPort: http
  selector:
    app: im
