# IM 仓库 — 工具版本与常用任务（与 Docker 镜像 elixir:1.19.5-otp-28 对齐；OTP ≥ 28.1）
# Mix 项目在 apps/elixir/im；见 docs/implementation/monorepo-layout.md

[tools]
erlang = "28.1"
elixir = "1.19.5-otp-28"
protoc = "29.3"

[env]
# 不在此固定 MIX_ENV：Mix 默认 dev，`mix test` 自动切 test，
# 显式设置会让 `mix test` 误跑在 dev 环境（Endpoint 起监听、连错库）。
# 需要 prod 的任务在自己的 env 中声明（见 im:release）。
IM_APP_DIR = "apps/elixir/im"

# ── Proto（仓库根）────────────────────────────────────────────────────────────

[tasks.proto-check]
description = "校验 proto 语法"
run = "protoc -I proto --descriptor_set_out=/dev/null proto/*.proto"

# 版本须与 apps/elixir/im/mix.exs 的 :protobuf 一致，否则生成物可能调用运行时库没有的 API
[tasks.proto-plugin]
description = "安装 protoc-gen-elixir（版本与 mix.exs 的 :protobuf 对齐）"
run = "cd apps/elixir/im && mix escript.install hex protobuf 0.17.0 --force"

# 生成物入库：Docker 构建阶段无需 protoc，clone 即可编译。
# 代价是改完 .proto 必须重跑本任务，proto-gen-check 会在 CI 上把漏跑挡下来。
[tasks.proto-gen]
description = "由 proto/ 生成 Elixir 代码到 im_proto/lib/pb/"
run = """
set -e
# mise 会把 MIX_HOME 指向它管理的 elixir 安装目录，escript 装在那儿而非 ~/.mix
escripts="${MIX_HOME:-$HOME/.mix}/escripts"
if [ ! -x "$escripts/protoc-gen-elixir" ]; then
  echo "未找到 protoc-gen-elixir，请先运行：mise run proto-plugin" >&2
  exit 1
fi
rm -rf apps/elixir/im_proto/lib/pb
# 输出根是 lib/：生成器按模块命名空间建子目录，package_prefix=pb 即落在 lib/pb/im/...
PATH="$escripts:$PATH" protoc \
  --proto_path=proto \
  --elixir_out=apps/elixir/im_proto/lib \
  --elixir_opt=package_prefix=pb \
  proto/*.proto
cd apps/elixir/im_proto && mix format "lib/pb/**/*.ex"
"""

[tasks.proto-gen-check]
description = "校验 lib/pb/ 与 proto/ 同步（CI 用）"
depends = ["proto-gen"]
# 用 status 而非 diff：新增 .proto 会产出未跟踪文件，git diff 看不到
run = """
changes=$(git status --porcelain -- apps/elixir/im_proto/lib/pb)
if [ -n "$changes" ]; then
  echo "错误：lib/pb/ 与 proto/ 不同步。请运行 'mise run proto-gen' 并提交生成物。" >&2
  echo "$changes" >&2
  exit 1
fi
echo "lib/pb/（im_proto）与 proto/ 同步"
"""

# ── Mix：apps/elixir/im ───────────────────────────────────────────────────────

[tasks."im:deps-get"]
description = "mix deps.get（IM 主服务）"
run = "cd apps/elixir/im && mix deps.get"

[tasks."im:deps-compile"]
description = "mix deps.compile"
run = "cd apps/elixir/im && mix deps.compile"

[tasks."im:setup"]
description = "首次初始化：proto + IM 依赖"
depends = ["proto-check", "im:deps-get", "im:deps-compile"]

[tasks."im:compile"]
description = "mix compile（MIX_ENV=dev，避免 test 依赖重复编译 Pb）"
depends = ["im:deps-get"]
env = { MIX_ENV = "dev" }
run = "cd apps/elixir/im && mix compile"

[tasks."im:compile-strict"]
description = "mix compile --warnings-as-errors（CI 用）"
depends = ["im:deps-get"]
run = "cd apps/elixir/im && mix compile --warnings-as-errors"

[tasks."im:audit"]
description = "依赖审计：检查已撤回（retired）的 hex 包"
depends = ["im:deps-get"]
run = "cd apps/elixir/im && mix hex.audit"

[tasks."im:credo"]
description = "Credo 静态分析（合入前门禁：高优先级零 issue）"
depends = ["im:deps-get"]
run = "cd apps/elixir/im && mix credo --min-priority high"

[tasks."im:docs"]
description = "生成 IM ExDoc（输出 apps/elixir/im/doc/）"
depends = ["im:compile"]
env = { MIX_ENV = "dev" }
run = "cd apps/elixir/im && mix docs"

[tasks.docs]
description = "生成全部 Elixir 项目 ExDoc（im + im_client + loadtest）"
depends = ["im:docs", "im_client:docs", "loadtest:docs"]

[tasks."im:test"]
description = "mix test（自动解析 PGPORT：15432 pg-forward 优先，其次 5432）"
depends = ["im:compile"]
run = """
set -e
# shellcheck source=deploy/elixir/im/scripts/resolve-pg-port.sh
source deploy/elixir/im/scripts/resolve-pg-port.sh
cd apps/elixir/im && mix test "$@"
"""

[tasks."im:coveralls"]
description = "mix coveralls（全量 test + 覆盖率 ≥80%，见 coveralls.json）"
depends = ["im:compile"]
run = """
set -e
source deploy/elixir/im/scripts/resolve-pg-port.sh
cd apps/elixir/im && mix coveralls
"""

[tasks."im:test-smoke"]
description = "Release 冒烟 ExUnit（等价 bin/smoke-messaging + smoke-auth）"
depends = ["im:compile"]
run = """
set -e
source deploy/elixir/im/scripts/resolve-pg-port.sh
cd apps/elixir/im && mix test test/im/release/
"""

[tasks."im:format"]
description = "mix format"
run = "cd apps/elixir/im && mix format"

[tasks."im:format-check"]
description = "mix format --check-formatted（CI 用）"
run = "cd apps/elixir/im && mix format --check-formatted"

[tasks."im:server"]
description = "mix phx.server（dev；自动解析 PGPORT）"
depends = ["im:compile"]
run = """
set -e
source deploy/elixir/im/scripts/resolve-pg-port.sh
cd apps/elixir/im && mix phx.server
"""

[tasks."im:release"]
description = "mix release（MIX_ENV=prod）"
env = { MIX_ENV = "prod" }
depends = ["im:deps-get"]
run = "cd apps/elixir/im && mix do compile, release"

# 兼容旧任务名（指向 im:*）
[tasks.deps-get]
depends = ["im:deps-get"]

[tasks.deps-compile]
depends = ["im:deps-compile"]

[tasks.setup]
depends = ["im:setup"]

[tasks.compile]
depends = ["im:compile"]

[tasks.test]
depends = ["im:test"]

[tasks.format]
depends = ["im:format"]

[tasks.format-check]
depends = ["im:format-check"]

[tasks.server]
depends = ["im:server"]

[tasks.release]
depends = ["im:release"]

[tasks.clean]
description = "mix clean"
run = "cd apps/elixir/im && mix clean"

[tasks.test-watch]
description = "mix test.watch（自动解析 PGPORT）"
run = """
set -e
source deploy/elixir/im/scripts/resolve-pg-port.sh
cd apps/elixir/im && mix test.watch
"""

[tasks.test-failed]
description = "mix test --failed（自动解析 PGPORT）"
depends = ["im:compile"]
run = """
set -e
source deploy/elixir/im/scripts/resolve-pg-port.sh
cd apps/elixir/im && mix test --failed
"""

[tasks.console]
description = "iex -S mix（自动解析 PGPORT）"
depends = ["im:compile"]
run = """
set -e
source deploy/elixir/im/scripts/resolve-pg-port.sh
cd apps/elixir/im && iex -S mix
"""

[tasks.ecto-create]
depends = ["im:compile"]
run = """
set -e
source deploy/elixir/im/scripts/resolve-pg-port.sh
cd apps/elixir/im && mix ecto.create
"""

[tasks.ecto-migrate]
depends = ["im:compile"]
run = """
set -e
source deploy/elixir/im/scripts/resolve-pg-port.sh
cd apps/elixir/im && mix ecto.migrate
"""

[tasks.ecto-setup]
depends = ["im:compile"]
run = """
set -e
source deploy/elixir/im/scripts/resolve-pg-port.sh
cd apps/elixir/im && mix ecto.setup
"""

[tasks.ecto-reset]
depends = ["im:compile"]
run = """
set -e
source deploy/elixir/im/scripts/resolve-pg-port.sh
cd apps/elixir/im && mix ecto.reset
"""

# ── 本地 CI ───────────────────────────────────────────────────────────────────

[tasks.check]
description = "提交前：proto + IM compile + test"
depends = ["proto-check", "im:compile", "im:test"]

[tasks.ci]
description = "CI 等价：proto + format + credo + 严格编译 + 依赖审计 + coveralls(≥80%) + im_client/loadtest test"
depends = [
  "proto-check",
  "proto-gen-check",
  "im:format-check",
  "im:credo",
  "im:compile-strict",
  "im:audit",
  "im:coveralls",
  "im_client:test",
  "loadtest:test",
]

# ── Kubernetes（deploy/elixir/im/k8s）─────────────────────────────────────────

[tasks.k8s-up]
description = "启动本地 K8s 依赖（redis + postgres + redpanda）"
run = """
kubectl apply -k deploy/elixir/im/k8s/
kubectl -n im-dev rollout status statefulset/redis --timeout=120s
kubectl -n im-dev rollout status statefulset/postgres --timeout=180s
kubectl -n im-dev rollout status deployment/redpanda --timeout=180s
"""

[tasks.k8s-down]
description = "删除本地 K8s 依赖"
run = "kubectl delete -k deploy/elixir/im/k8s/"

[tasks.k8s-status]
description = "查看 im-dev 命名空间 Pod/Service"
run = "kubectl -n im-dev get pods,svc"

[tasks.k8s-full]
description = "部署全栈（依赖 + IM Release 清单，不构建镜像）"
run = "kubectl apply -k deploy/elixir/im/k8s/overlays/local/"

[tasks.k8s-kafka-event-bus]
description = "部署全栈 + Redpanda，并开启 Event Bus 旁路（按需）"
run = "kubectl apply -k deploy/elixir/im/k8s/overlays/kafka-event-bus/"

[tasks.k8s-logs]
description = "跟踪 IM Pod 日志"
run = "kubectl -n im-dev logs -f deployment/im"

[tasks.k8s-port-forward]
description = "将 IM 服务转发到本机 4000"
run = "kubectl -n im-dev port-forward svc/im 4000:4000"

# mix test 连的是 K8s 里的 Postgres。kubectl port-forward 会在 Pod 重建或空闲时断开，
# 这里自动重连，省得测试跑到一半报 econnrefused。用法：另开一个终端常驻。
[tasks.pg-forward]
description = "把 K8s Postgres 常驻转发到本机 15432（mix test 用）"
run = """
echo "Postgres → localhost:15432（Ctrl-C 退出）；另开终端直接 mise run test（自动选 PGPORT）"
while true; do
  kubectl -n im-dev port-forward statefulset/postgres 15432:5432 || true
  echo "转发断开，2 秒后重连…" >&2
  sleep 2
done
"""

# ── Release 镜像 + K8s 验收 ───────────────────────────────────────────────────

[tasks.release-build]
description = "docker build IM Release 镜像"
run = "docker build -f deploy/elixir/im/Dockerfile -t im:local ."

[tasks.release-deploy]
description = "构建 Release 镜像并部署到本地 K8s（单副本 local overlay）"
run = "./deploy/elixir/im/scripts/release-deploy-local.sh"

[tasks.release-deploy-cluster]
description = "构建 Release 镜像并部署到本地 K8s（多副本 cluster overlay）"
env = { IM_K8S_OVERLAY = "deploy/elixir/im/k8s/overlays/cluster" }
run = "./deploy/elixir/im/scripts/release-deploy-local.sh"

[tasks.release-deploy-skip-build]
description = "仅重新部署 K8s（跳过 docker build）"
env = { IM_SKIP_BUILD = "1" }
run = "./deploy/elixir/im/scripts/release-deploy-local.sh"

[tasks.release-smoke]
description = "冒烟：/health/live + /health/ready（需先 k8s-port-forward）"
run = """
curl -sf http://localhost:4000/health/live && echo
curl -sf http://localhost:4000/health/ready && echo
"""

[tasks.release-smoke-messaging]
description = "冒烟：健康 + Pod 内消息/会话未读（见 release-smoke-messaging.md）"
run = "chmod +x deploy/elixir/im/scripts/release-smoke-messaging.sh && ./deploy/elixir/im/scripts/release-smoke-messaging.sh"

[tasks.release-smoke-auth]
description = "冒烟：健康 + Pod 内 REST 登录（见 release-smoke-auth.md）"
run = "chmod +x deploy/elixir/im/scripts/release-smoke-auth.sh && ./deploy/elixir/im/scripts/release-smoke-auth.sh"

[tasks.flamegraph]
description = "采集 IM CPU 火焰图（K8s + Erlang perf → artifacts/flamegraph/，见 docs/implementation/elixir/flamegraph.md）"
run = "chmod +x deploy/elixir/im/scripts/flamegraph-mise.sh deploy/elixir/im/scripts/capture-flamegraph.sh && ./deploy/elixir/im/scripts/flamegraph-mise.sh"

[tasks."im:flamegraph"]
description = "同 flamegraph（IM 别名）"
depends = ["flamegraph"]

[tasks.verify]
description = "完整验收：check + Release 构建部署"
depends = ["check", "release-deploy"]

# ── Mix：apps/elixir/im_client ────────────────────────────────────────────────

[tasks."im_client:deps-get"]
description = "mix deps.get（im_client）"
run = "cd apps/elixir/im_client && mix deps.get"

[tasks."im_client:test"]
description = "im_client mix test"
depends = ["im_client:deps-get"]
run = "cd apps/elixir/im_client && mix test"

[tasks."im_client:docs"]
description = "生成 im_client ExDoc（输出 apps/elixir/im_client/doc/）"
depends = ["im_client:deps-get"]
env = { MIX_ENV = "dev" }
run = "cd apps/elixir/im_client && mix docs"

# ── Mix：apps/elixir/loadtest ─────────────────────────────────────────────────

[tasks."loadtest:deps-get"]
description = "mix deps.get（loadtest）"
run = "cd apps/elixir/loadtest && mix deps.get"

[tasks."loadtest:test"]
description = "loadtest mix test"
depends = ["loadtest:deps-get"]
run = "cd apps/elixir/loadtest && mix test"

[tasks."loadtest:run"]
description = "运行压测（透传参数，例：mise run loadtest:run -- connection_load --app-key X）"
depends = ["loadtest:deps-get"]
run = "cd apps/elixir/loadtest && mix loadtest.run $@"

[tasks."loadtest:docs"]
description = "生成 loadtest ExDoc（输出 apps/elixir/loadtest/doc/）"
depends = ["loadtest:deps-get"]
env = { MIX_ENV = "dev" }
run = "cd apps/elixir/loadtest && mix docs"

# ── Web：apps/web/im-console ──────────────────────────────────────────────────

[tasks."web:install"]
description = "npm ci（im-console）"
run = "cd apps/web/im-console && npm ci"

[tasks."web:proto"]
description = "proto → TypeScript（im-console）"
run = "cd apps/web/im-console && npm run proto"

[tasks."web:dev"]
description = "Vite 开发服务器（proxy → localhost:4000）"
run = "cd apps/web/im-console && npm run dev"

[tasks."web:test"]
description = "im-console Vitest"
run = "cd apps/web/im-console && npm test"

[tasks."web:build"]
description = "构建 im-console 静态资源"
run = "cd apps/web/im-console && npm run build"
