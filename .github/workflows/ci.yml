# 与本地 `mise run ci` 对齐：proto-check → format-check → 严格编译 → 依赖审计 → test
# 另有 release job 验证 Dockerfile 可构建（黄金路径见 release-deploy-test.md）
# mix.exs 位于 apps/elixir/im；见 docs/implementation/monorepo-layout.md
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: proto-check
        run: mise run proto-check

      - name: 安装 protoc-gen-elixir
        run: mise run proto-plugin

      # 生成物入库，漏跑 proto-gen 会让 lib/pb 与 proto/ 悄悄漂移
      - name: 校验 lib/pb 与 proto 同步
        run: mise run proto-gen-check

  elixir:
    name: Elixir
    runs-on: ubuntu-latest
    needs: proto
    if: hashFiles('apps/elixir/im/mix.exs') != ''

    # mix test 需要 Postgres（Ecto Sandbox）；凭据与本地依赖栈
    # deploy/elixir/im/k8s/base/deps/postgres.yaml 保持一致
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: im
          POSTGRES_PASSWORD: im_dev_only
          POSTGRES_DB: im_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true

      # 依赖与编译产物缓存，避免每次重编 Phoenix/Ecto 全量依赖
      - uses: actions/cache@v4
        with:
          path: |
            apps/elixir/im/deps
            apps/elixir/im/_build
          key: elixir-${{ runner.os }}-${{ hashFiles('apps/elixir/im/mix.lock') }}
          restore-keys: elixir-${{ runner.os }}-

      - name: mix format --check-formatted
        run: mise run format-check

      - name: mix compile --warnings-as-errors
        run: mise run im:compile-strict

      - name: 依赖审计（已撤回的 hex 包）
        run: mise run im:audit

      # GHA postgres service 监听 5432（非 OrbStack 的 15432 pg-forward）
      - name: mix test
        env:
          PGPORT: "5432"
        run: mise run test

      - name: Release 冒烟（进程内，G-61）
        env:
          PGPORT: "5432"
        run: mise run im:test-smoke

  web-console:
    name: im-console
    runs-on: ubuntu-latest
    needs: proto
    if: hashFiles('apps/web/im-console/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/im-console/package-lock.json
      - name: npm ci
        run: mise run web:install
      - name: vitest
        run: mise run web:test
      - name: vite build
        run: mise run web:build

  im_client:
    name: im_client
    runs-on: ubuntu-latest
    needs: proto
    if: hashFiles('apps/elixir/im_client/mix.exs') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: actions/cache@v4
        with:
          path: |
            apps/elixir/im_client/deps
            apps/elixir/im_client/_build
          key: im-client-${{ runner.os }}-${{ hashFiles('apps/elixir/im_client/mix.lock') }}
          restore-keys: im-client-${{ runner.os }}-
      - name: mix test
        run: mise run im_client:test

  loadtest:
    name: loadtest
    runs-on: ubuntu-latest
    needs: im_client
    if: hashFiles('apps/elixir/loadtest/mix.exs') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: actions/cache@v4
        with:
          path: |
            apps/elixir/loadtest/deps
            apps/elixir/loadtest/_build
            apps/elixir/im_client/deps
            apps/elixir/im_client/_build
          key: loadtest-${{ runner.os }}-${{ hashFiles('apps/elixir/loadtest/mix.lock', 'apps/elixir/im_client/mix.lock') }}
          restore-keys: loadtest-${{ runner.os }}-
      - name: mix test
        run: mise run loadtest:test

  release:
    name: Release 镜像
    runs-on: ubuntu-latest
    needs: elixir
    if: hashFiles('apps/elixir/im/mix.exs') != ''
    steps:
      - uses: actions/checkout@v4

      # 与本地、线上使用同一个 Dockerfile，防止 Release 构建回归
      - name: docker build
        run: docker build -f deploy/elixir/im/Dockerfile -t im:${{ github.sha }} .
