# 与本地 `mise run ci` 对齐：proto-check → format-check → compile → test
# mix.exs 位于 apps/elixir/im；见 docs/implementation/monorepo-layout.md
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: proto-check
        run: mise run proto-check

  elixir:
    name: Elixir
    runs-on: ubuntu-latest
    needs: proto
    if: hashFiles('apps/elixir/im/mix.exs') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: mix format --check-formatted
        run: mise run format-check

      - name: mix compile
        run: mise run compile

      - name: mix test
        run: mise run test
